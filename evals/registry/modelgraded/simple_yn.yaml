simple_yn:
  prompt: |
    You are an evaluator tasked with grading whether the model's response satisfies the expectations described below.

    ## Instructions:
    - Answer "YES" if the model's output meets the expectation.
    - Answer "NO" if it does not.

    ## Inputs:
    {input}

    ## Expected (ideal) behavior:
    {ideal}

    ## Model's response:
    {completion}

    IMPORTANT: Respond with ONLY a single word: "YES" or "NO" without any punctuation or additional text.
  
  choice_strings: ["YES", "NO", "Y", "N", "S"]
  choice_scores:
    "YES": 1.0
    "NO": 0.0
    "Y": 1.0
    "N": 0.0
    "S": 0.0
  input_outputs:
    input: "completion"
